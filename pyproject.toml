[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubo"
version = "0.1.0"
description = "Beneficial ownership tracing and sanctions evasion detection across six public registers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
llm = ["anthropic>=0.40"]
tracking = ["mlflow>=2.12"]
serving = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
ubo = "ubo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 128
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
