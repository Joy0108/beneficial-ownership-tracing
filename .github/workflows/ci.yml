name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Rebuild registers
        run: python scripts/build_registers.py

      # The registers are generated from a seeded world; a diff here means the
      # generator changed and the committed corpus no longer matches it.
      - name: Registers are reproducible
        run: git diff --exit-code data/

      - name: Tests
        run: pytest

      # Fails on any blocking promotion gate: entity-resolution F1 and
      # precision, candidate recall, layering precision, regulatory recall,
      # citation resolution, and the absolute PEP-language gate.
      - name: Evaluation and promotion gates
        run: python -m ubo.cli eval

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: reports/
